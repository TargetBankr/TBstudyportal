name: Generate HARTRON DEO question bank

on:
  workflow_dispatch:
    inputs:
      shift:
        description: "Shift: 1 = Subject 1 (Windows, Networking, Computer Fundamentals), 2 = Subject 2 (Internet, HTML/DHTML, MS Office)"
        type: choice
        required: true
        default: "1"
        options: ["1", "2"]
      model:
        description: "Gemini model (pick from the list)"
        type: choice
        required: true
        default: "gemini-2.5-flash"
        options:
          - gemini-2.5-flash
          - gemini-2.5-flash-lite
          - gemini-3.5-flash
          - gemini-3.5-flash-lite
          - gemini-3.6-flash
          - gemini-3.7-flash
      custom_model:
        description: "Optional: type any other model name here. If filled, it overrides the dropdown above."
        type: string
        default: ""
      verify_model:
        description: "Model for the answer-key check"
        type: choice
        required: true
        default: "same-as-model"
        options:
          - same-as-model
          - gemini-2.5-flash
          - gemini-2.5-flash-lite
          - gemini-3.5-flash
          - gemini-3.5-flash-lite
          - gemini-3.6-flash
          - gemini-3.7-flash
      verify:
        description: "Run the answer-key verification pass"
        type: boolean
        default: true
      only:
        description: "Optional: comma-separated mock ids to run (e.g. S1_03,S1_04). Leave empty for the whole shift."
        type: string
        default: ""

permissions:
  contents: write

# One run at a time so two shifts never push over each other.
concurrency:
  group: qbank
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate topic map
        run: python generate.py --check

      - name: Generate shift
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHIFT: ${{ inputs.shift }}
          MODEL: ${{ inputs.model }}
          CUSTOM_MODEL: ${{ inputs.custom_model }}
          VERIFY_MODEL: ${{ inputs.verify_model }}
          VERIFY: ${{ inputs.verify }}
          ONLY: ${{ inputs.only }}
        run: |
          FINAL_MODEL="$MODEL"
          if [ -n "$CUSTOM_MODEL" ]; then FINAL_MODEL="$CUSTOM_MODEL"; fi
          if ! echo "$FINAL_MODEL" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Model name has invalid characters: $FINAL_MODEL"; exit 1
          fi
          echo "Generation model: $FINAL_MODEL"
          ARGS="--shift $SHIFT --model $FINAL_MODEL"
          if [ "$VERIFY_MODEL" != "same-as-model" ] && [ -n "$VERIFY_MODEL" ]; then
            echo "Verification model: $VERIFY_MODEL"
            ARGS="$ARGS --verify-model $VERIFY_MODEL"
          else
            echo "Verification model: same as generation model"
          fi
          if [ "$VERIFY" = "false" ]; then ARGS="$ARGS --no-verify"; fi
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          python generate.py $ARGS

      # Runs even if the generator stopped early (quota), so progress is never lost.
      - name: Commit progress
        if: always()
        env:
          SHIFT: ${{ inputs.shift }}
        run: |
          git config user.name "qbank-bot"
          git config user.email "qbank-bot@users.noreply.github.com"
          git add bank cache review
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "qbank: shift $SHIFT progress"
            git pull --rebase
            git push
          fi

      # Status table at the top of the run page, so you can see the result without opening logs.
      - name: Show status on the run page
        if: always()
        run: |
          if [ -f bank/STATUS.md ]; then cat bank/STATUS.md >> "$GITHUB_STEP_SUMMARY"; fi

      # One clean zip: every finished mock .md for this subject + master file + status + review log.
      - name: Collect download
        if: always()
        env:
          SHIFT: ${{ inputs.shift }}
        run: |
          mkdir -p download
          cp bank/subject${SHIFT}/*.md download/ 2>/dev/null || true
          cp bank/STATUS.md download/ 2>/dev/null || true
          cp review/review_log.jsonl download/ 2>/dev/null || true
          echo "Files in download:"; ls -1 download

      - name: Upload download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HARTRON-DEO-subject${{ inputs.shift }}-questions
          path: download
          if-no-files-found: warn
          retention-days: 14
